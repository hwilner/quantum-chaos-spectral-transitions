name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, NumPy ${{ matrix.numpy-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suite must pass on both supported NumPy majors: the package
        # supports NumPy 1.x and 2.x, and the spelling of the trapezoid rule
        # differs between them.  The constraint is spelled out in full for
        # each row because a short form such as "numpy~1.x" is not a valid
        # requirement specifier.  The combinations are listed one by one so
        # that a Python version is never paired with the wrong constraint.
        include:
          - python-version: "3.11"
            numpy-version: "1.x"
            numpy-spec: "numpy>=1.24,<2"
          - python-version: "3.11"
            numpy-version: "2.x"
            numpy-spec: "numpy>=2"
          - python-version: "3.12"
            numpy-version: "1.x"
            numpy-spec: "numpy>=1.24,<2"
          - python-version: "3.12"
            numpy-version: "2.x"
            numpy-spec: "numpy>=2"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.numpy-spec }}" "scipy>=1.10" pytest
          python -m pip install -e . --no-deps

      - name: Run test suite
        run: python -m pytest -q

      - name: Check the documented test count
        run: python tools/check_doc_test_count.py

  install:
    name: Install from a clean checkout
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package and its dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Import the installed package
        run: python -c "import spectral_chaos; print(spectral_chaos.__version__)"
