[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-chaos"
version = "0.1.0"
description = "Quantum-chaos spectral statistics of functional brain networks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Make the package importable from a fresh clone without setting PYTHONPATH.
pythonpath = ["src"]
testpaths = ["tests"]
